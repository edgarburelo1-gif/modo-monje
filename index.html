<title>🛡️ Modo Monje</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0a0a0f;
    color: #e8e4dc;
    font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  .header {
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1025 100%);
    border-bottom: 1px solid #2a2040;
    padding: 52px 20px 20px;
    text-align: center;
  }

  .header-title { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }

  .week-nav {

    position: sticky; top: 0; z-index: 10;
  }
  .week-btn { background: #1e1a2e; border: none; color: #a094c0; border-radius: 8px; padding: 6px 16px; font-size: 16px; cursor: pointer; }
  .week-info { text-align: center; }
  .week-title { font-weight: 700; font-size: 14px; color: #fff; }
  .week-sub { font-size: 10px; color: #6b6080; margin-top: 2px; }

  .tab-bar { display: flex; gap: 8px; padding: 12px 20px 0; }
  .tab-btn {
    flex: 1; padding: 9px 0; border-radius: 10px; border: none;
    font-weight: 600; font-size: 12px; cursor: pointer; transition: all 0.2s;

  .tab-btn.inactive { background: #1a1630; color: #6b6080; }

  .content { padding: 16px 20px; }

  .section-title { margin-top: 24px; margin-bottom: 10px; }
  .section-title:first-child { margin-top: 8px; }
  .section-title-row { display: flex; align-items: center; gap: 8px; }
  .section-title-text { font-weight: 800; font-size: 14px; color: #fff; letter-spacing: -0.3px; }
  .section-subtitle { font-size: 10px; color: #5a5070; margin-top: 2px; margin-left: 26px; letter-spacing: 0.5px; text-transform: uppercase; }

  .habit-card {
    background: #0f0f1a; border: 1px solid #1e1a2e;
    border-radius: 14px; margin-bottom: 12px; overflow: hidden;
  }
  .habit-header { padding: 12px 14px 8px; display: flex; gap: 10px; align-items: flex-start; }
  .habit-emoji { font-size: 18px; flex-shrink: 0; }
  .habit-name { font-weight: 700; font-size: 13px; color: #e8e4dc; }
  .habit-desc { font-size: 11px; color: #5a5070; margin-top: 2px; line-height: 1.4; }
  .habit-days { display: flex; border-top: 1px solid #1e1a2e; }
  .day-btn {
    flex: 1; padding: 8px 0; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: background 0.15s;
  }
  .day-btn:not(:last-child) { border-right: 1px solid #1e1a2e; }
  .day-btn.done { background: #1e3a22; }
  .day-btn.undone { background: transparent; }
  .day-label { font-size: 9px; color: #5a5070; font-weight: 600; letter-spacing: 0.5px; }
  .day-check { font-size: 14px; }

  .milestone-btn {
    width: 100%; display: flex; align-items: flex-start; gap: 12px;
    border-radius: 14px; padding: 14px; margin-bottom: 10px;

    transition: all 0.2s;
  }
  .milestone-btn.done { background: #0f2a14; border-color: #2a5030; }

  .milestone-emoji { font-size: 20px; margin-top: 1px; flex-shrink: 0; }
  .milestone-body { flex: 1; }
  .milestone-row { display: flex; justify-content: space-between; align-items: center; }
  .milestone-name { font-weight: 700; font-size: 13px; }
  .milestone-name.done { color: #4ade80; }
  .milestone-name.undone { color: #e8e4dc; }
  .milestone-check { font-size: 18px; }
  .milestone-desc { font-size: 11px; color: #5a5070; margin-top: 3px; line-height: 1.5; }

  .limits-card { background: #1a0f0f; border: 1px solid #3a1a1a; border-radius: 14px; padding: 14px; }
  .limit-row { display: flex; gap: 10px; padding: 8px 0; align-items: flex-start; }
  .limit-row:not(:last-child) { border-bottom: 1px solid #2a1515; }
  .limit-x { color: #ef4444; font-size: 14px; flex-shrink: 0; }
  .limit-text { font-size: 12px; color: #c0a0a0; line-height: 1.5; }

  .review-hero {
    background: #0f0f1a; border: 1px solid #2a2040;
    border-radius: 16px; padding: 20px; margin-bottom: 16px; text-align: center;
  }
  .review-eyebrow { font-size: 10px; color: #6b6080; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  .review-pct { font-size: 52px; font-weight: 900; line-height: 1; }
  .review-sub { font-size: 12px; color: #8b7fa8; margin-top: 6px; }
  .review-missing { font-size: 11px; font-weight: 600; margin-top: 8px; color: #ef4444; }

  .progress-item {
    background: #0f0f1a; border: 1px solid #1e1a2e;
    border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .progress-emoji { font-size: 16px; flex-shrink: 0; }
  .progress-body { flex: 1; }
  .progress-name { font-size: 12px; font-weight: 600; color: #e8e4dc; margin-bottom: 4px; }
  .progress-bar-bg { height: 4px; background: #1e1a2e; border-radius: 4px; }
  .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
  .progress-count { font-size: 12px; font-weight: 700; min-width: 36px; text-align: right; }

  .project-list { background: #0f0f1a; border: 1px solid #1e1a2e; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .project-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
  .project-row:not(:last-child) { border-bottom: 1px solid #1e1a2e; }
  .project-label { font-size: 12px; }
  .project-label.done { color: #4ade80; }
  .project-label.undone { color: #6b6080; }

  .week-history { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .week-pill { width: 44px; border-radius: 10px; padding: 8px 4px; text-align: center; border: 1px solid; }
  .week-pill-label { font-size: 9px; color: #5a5070; margin-bottom: 4px; }
  .week-pill-val { font-size: 12px; font-weight: 700; }

  .bw-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .bw-card { flex: 1; border-radius: 12px; padding: 12px; text-align: center; }
  .bw-card.best { background: #0f2a14; border: 1px solid #2a5030; }
  .bw-card.worst { background: #2a0f0f; border: 1px solid #5a1a1a; }
  .bw-eyebrow { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .bw-card.best .bw-eyebrow { color: #4ade80; }
  .bw-card.worst .bw-eyebrow { color: #ef4444; }
  .bw-week { font-size: 20px; font-weight: 800; }
  .bw-card.best .bw-week { color: #4ade80; }
  .bw-card.worst .bw-week { color: #ef4444; }
  .bw-pct { font-size: 12px; }
  .bw-card.best .bw-pct { color: #4ade80; }
  .bw-card.worst .bw-pct { color: #ef4444; }

  .footer-note {
    background: #0f0f1a; border: 1px solid #2a2040;
    border-radius: 12px; padding: 14px; font-size: 11px;
    color: #5a5070; line-height: 1.7; text-align: center;
  }
  .footer-note span { color: #8b7fa8; font-weight: 600; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #22c55e; color: #fff; padding: 10px 20px;
    border-radius: 20px; font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999;
  }
  .toast.show { opacity: 1; }

  .pilar-badge {
    display: inline-block; font-size: 9px; font-weight: 700;
    padding: 2px 7px; border-radius: 6px; margin-top: 4px; letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .pilar-apertura { background: #1a2a3a; color: #60a5fa; }
  .pilar-negocio  { background: #1a2a1a; color: #4ade80; }
  .pilar-tiktok   { background: #2a1a2a; color: #c084fc; }
  .pilar-rodilla  { background: #2a1a1a; color: #f87171; }
  .pilar-ahorro   { background: #2a2010; color: #fbbf24; }
  .pilar-mente    { background: #1a1a2a; color: #a5b4fc; }

  /* BIBLIOTECA */
  .libro-card {
    background: #0f0f1a; border: 1px solid #1e1a2e;
    border-radius: 14px; padding: 14px; margin-bottom: 10px;
    display: flex; gap: 12px; align-items: flex-start;
    cursor: pointer; transition: border-color 0.2s;
  }
  .libro-card.leido { background: #0f2a14; border-color: #2a5030; }
  .libro-card:active { opacity: 0.8; }
  .libro-emoji { font-size: 28px; flex-shrink: 0; }
  .libro-body { flex: 1; }
  .libro-titulo { font-weight: 800; font-size: 13px; color: #e8e4dc; }
  .libro-autor  { font-size: 11px; color: #5a5070; margin-top: 2px; }
  .libro-pilar  { margin-top: 5px; }
  .libro-por-que { font-size: 11px; color: #7a7090; margin-top: 5px; line-height: 1.5; }
  .libro-check  { font-size: 20px; align-self: center; flex-shrink: 0; }
  .libro-prioridad {
    display: inline-block; font-size: 9px; font-weight: 700;
    padding: 2px 7px; border-radius: 6px; margin-top: 4px;
    background: #2a200a; color: #fbbf24; text-transform: uppercase; letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast">✓ Guardado</div>

<script>
const WEEKS_TOTAL = 13;
const STORAGE_KEY = 'modo_monje_v3';

// ── HÁBITOS DIARIOS ─────────────────────────────────────────────────────────
// 5 hábitos × 6 días (Lun–Sáb)
const DAILY_HABITS = [
  {

  },
  {

    emoji: '🦵',
    label: 'Rehabilitación de Rodilla',
    desc: '3x por semana (marca solo los días que entrenas). Protocolo del rehabilitador.',

    pilarLabel: 'Salud'
  },
  {

    emoji: '📱',
    label: 'Contenido TikTok @garyburelo',
    desc: 'Publicar o grabar contenido hoy. Meta: 2,000 seguidores.',
    pilar: 'tiktok',
    pilarLabel: 'TikTok'
  },
  {
    id: 'mente',
    emoji: '🧠',
    label: 'Práctica Mental',
    desc: '10 min de meditación, lectura o journaling. Sin pantallas primero.',
    pilar: 'mente',
    pilarLabel: 'Mente'
  },
  {
    id: 'cierre',
    emoji: '🌙',
    label: 'Revisión Nocturna',
    desc: '5 min: 1 cosa buena, 1 mejora, mañana listado. Luces apagadas 9:30 PM.',
    pilar: 'apertura',
    pilarLabel: 'Disciplina'
  },
];

// ── HITOS SEMANALES ──────────────────────────────────────────────────────────
const WEEKLY_MILESTONES = [
  {
    id: 'ahorro',
    emoji: '💰',
    label: 'Ahorro semanal: $1,000 pesos',
    desc: 'Separar y guardar los 1,000 pesos de esta semana. Intocable hasta la meta.'
  },
  {
    id: 'negocio',
    emoji: '🏪',
    label: 'Acción de crecimiento en Color Centro',
    desc: 'Una acción concreta: nuevo cliente, mejora en atención, surtido, o proceso.'
  },
];

// ── METAS DE PROYECTO ─────────────────────────────────────────────────────────
// Objetivos de una sola vez que cierran este ciclo de 90 días
const PROJECT_MILESTONES = [
  {
    id: 'tiktok2k',
    emoji: '📱',
    label: '2,000 seguidores en @garyburelo',
    desc: 'Meta de TikTok para activar el programa de afiliados.'
  },
  {
    id: 'sueldo',
    emoji: '🏠',
    label: 'Sueldo de $30,000/mes desde Color Centro',
    desc: 'Independencia económica con Fer. Primer mes en que el negocio paga ese sueldo.'
  },
  {
    id: 'ahorro_meta',
    emoji: '🎯',
    label: 'Fondo de ahorro acumulado: $13,000',
    desc: '13 semanas × $1,000 pesos. Base para la siguiente etapa.'
  },
];

const DAYS = ['Lun','Mar','Mié','Jue','Vie','Sáb'];

// ── BIBLIOTECA ────────────────────────────────────────────────────────────────
const LIBROS = [
  // PRIORIDAD INMEDIATA
  { id: 'atomic', emoji: '⚛️', titulo: 'Atomic Habits', autor: 'James Clear', pilar: 'apertura', pilarLabel: 'Disciplina', prioridad: true, porQue: 'El despertador y los hábitos diarios dejan de depender de la motivación. Empieza aquí.' },
  { id: 'hormozi', emoji: '💥', titulo: '$100M Offers', autor: 'Alex Hormozi', pilar: 'negocio', pilarLabel: 'Color Centro', prioridad: true, porQue: 'Hace que tu negocio sea la opción obvia para el cliente. Aplicable directo a la tlapalería.' },
  // DISCIPLINA
  { id: 'milagro', emoji: '🌅', titulo: 'El Milagro de la Mañana', autor: 'Hal Elrod', pilar: 'apertura', pilarLabel: 'Disciplina', prioridad: false, porQue: 'Rutina de madrugada paso a paso. Fácil de leer, fácil de aplicar desde el día 1.' },
  // NEGOCIO
  { id: 'babilonia', emoji: '🏛️', titulo: 'El Hombre Más Rico de Babilonia', autor: 'George Clason', pilar: 'negocio', pilarLabel: 'Color Centro', prioridad: false, porQue: 'Principios financieros básicos. Aplica directo al ahorro y la operación de Color Centro.' },
  { id: 'gerente', emoji: '🗂️', titulo: 'El Gerente Efectivo', autor: 'Peter Drucker', pilar: 'negocio', pilarLabel: 'Color Centro', prioridad: false, porQue: 'Para pensar como dueño, no como operador. Clave para la meta de $30k/mes.' },
  // TIKTOK
  { id: 'jabright', emoji: '🥊', titulo: 'Jab, Jab, Jab, Right Hook', autor: 'Gary Vaynerchuk', pilar: 'tiktok', pilarLabel: 'TikTok', prioridad: false, porQue: 'Estrategia de contenido orientada a ventas reales. Directo para @garyburelo.' },
  { id: 'storybrand', emoji: '📖', titulo: 'Building a StoryBrand', autor: 'Donald Miller', pilar: 'tiktok', pilarLabel: 'TikTok', prioridad: false, porQue: 'Cómo comunicar lo que vendes para que la gente lo entienda y compre. Perfecto para TikTok afiliado.' },
  // MENTE
  { id: 'ahora', emoji: '🧘', titulo: 'El Poder del Ahora', autor: 'Eckhart Tolle', pilar: 'mente', pilarLabel: 'Mente', prioridad: false, porQue: 'Para callar el ruido mental. Funciona en sesiones de 10 min, perfecto para tu práctica matutina.' },
  { id: 'estoico', emoji: '🏛️', titulo: 'La Disciplina del Estoico', autor: 'Ryan Holiday', pilar: 'mente', pilarLabel: 'Mente', prioridad: false, porQue: 'Mentalidad para días difíciles. Muy aplicable a emprendedores con presión diaria.' },
  // RODILLA
  { id: 'goggins', emoji: '💪', titulo: "Can't Hurt Me", autor: 'David Goggins', pilar: 'rodilla', pilarLabel: 'Rehabilitación', prioridad: false, porQue: 'Para los días que no quieres ir al gym. Brutal y honesto. Te mueve.' },
  // AHORRO
  { id: 'padrerich', emoji: '💰', titulo: 'Padre Rico, Padre Pobre', autor: 'Robert Kiyosaki', pilar: 'ahorro', pilarLabel: 'Ahorro', prioridad: false, porQue: 'Base financiera. Si ya lo leíste, ve directo al Fastlane.' },
  { id: 'fastlane', emoji: '🚀', titulo: 'The Millionaire Fastlane', autor: 'MJ DeMarco', pilar: 'ahorro', pilarLabel: 'Ahorro', prioridad: false, porQue: 'Más actualizado y agresivo que Kiyosaki. Para entender cómo escalar ingresos, no solo ahorrar.' },
];

const LIMITS = [
  'PROHIBIDO iniciar negocios o proyectos nuevos fuera de este plan.',
  'PROHIBIDO cargar más peso del autorizado en rehabilitación — respetar el protocolo.',
  'PROHIBIDO saltarse el despertador. Si abres tarde, ese día cuenta como rojo.',
];

// ── STATE ─────────────────────────────────────────────────────────────────────
let state = { data: {}, week: 1, view: 'week' };

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.data = JSON.parse(raw);
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
    showToast();
  } catch(e) {}
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1200);
}

function toggle(key) {
  state.data[key] = !state.data[key];
  saveState();
  render();
}

// ── SCORES ────────────────────────────────────────────────────────────────────
function weekScore(w) {
  const totalDaily = DAILY_HABITS.length * 6;
  const totalWeekly = WEEKLY_MILESTONES.length;
  const total = totalDaily + totalWeekly;
  let done = 0;
  for (let d = 0; d < 6; d++)
    for (const h of DAILY_HABITS)
      if (state.data[`w${w}_d${d}_${h.id}`]) done++;
  for (const m of WEEKLY_MILESTONES)
    if (state.data[`w${w}_wm_${m.id}`]) done++;
  return { done, total, pct: Math.round((done/total)*100) };
}

function projectScore() {
  const done = PROJECT_MILESTONES.filter(m => state.data[`pm_${m.id}`]).length;
  const total = PROJECT_MILESTONES.length;
  return { done, total, pct: Math.round((done/total)*100) };
}

function overallScore() {
  let td = 0, ta = 0;
  for (let w = 1; w <= WEEKS_TOTAL; w++) {
    const s = weekScore(w); td += s.done; ta += s.total;
  }
  const ps = projectScore(); td += ps.done; ta += ps.total;
  return Math.round((td/ta)*100);
}

function habitScore(hid) {
  let done = 0, total = 0;
  for (let w = 1; w <= WEEKS_TOTAL; w++)
    for (let d = 0; d < 6; d++) {
      total++;
      if (state.data[`w${w}_d${d}_${hid}`]) done++;
    }
  return { done, total, pct: Math.round((done/total)*100) };
}

function pctColor(p) {
  if (p >= 80) return '#22c55e';
  if (p >= 50) return '#f59e0b';
  return '#ef4444';
}

function pctLabel(p) {
  if (p >= 90) return 'MODO MONJE ACTIVADO 🔥';
  if (p >= 70) return 'Avanzando fuerte 💪';
  if (p >= 50) return 'En progreso — sube el ritmo ⚡';
  return 'Área de mejora — sin autoengaños ⚠️';
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function sectionTitle(emoji, text, sub) {
  return `<div class="section-title">
    <div class="section-title-row">
      <span>${emoji}</span>
      <span class="section-title-text">${text}</span>
    </div>
    ${sub ? `<div class="section-subtitle">${sub}</div>` : ''}
  </div>`;
}

function milestoneCard(m, done, key) {
  return `<button class="milestone-btn ${done?'done':'undone'}" onclick="toggle('${key}')">
    <span class="milestone-emoji">${m.emoji}</span>
    <div class="milestone-body">
      <div class="milestone-row">
        <span class="milestone-name ${done?'done':'undone'}">${m.label}</span>
        <span class="milestone-check">${done?'✅':'⬜'}</span>
      </div>
      <div class="milestone-desc">${m.desc}</div>
    </div>
  </button>`;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const ws = weekScore(state.week);
  const ps = projectScore();
  const overall = overallScore();

  let html = `
  <div class="header">
    <div class="header-eyebrow">Plan 90 días · Edgar Burelo</div>
    <div class="header-title">🛡️ MODO MONJE</div>
    <div class="header-subtitle">Color Centro · TikTok · Rodilla · Independencia</div>
    <div class="header-stats">
      <div class="stat-box">
        <div class="stat-val" style="color:${pctColor(ws.pct)}">${ws.pct}%</div>
        <div class="stat-lbl">Esta semana</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" style="color:${pctColor(ps.pct)}">${ps.pct}%</div>
        <div class="stat-lbl">Proyectos</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" style="color:${pctColor(overall)}">${overall}%</div>
        <div class="stat-lbl">90 días</div>
      </div>
    </div>
    <div class="header-status" style="color:${pctColor(ws.pct)}">${pctLabel(ws.pct)}</div>
  </div>

  <div class="week-nav">
    <button class="week-btn" onclick="changeWeek(-1)">◀</button>
    <div class="week-info">
      <div class="week-title">Semana ${state.week} de ${WEEKS_TOTAL}</div>
      <div class="week-sub">${ws.done}/${ws.total} hábitos cumplidos</div>
    </div>
    <button class="week-btn" onclick="changeWeek(1)">▶</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn ${state.view==='week'?'active':'inactive'}" onclick="setView('week')">📅 Semana</button>
    <button class="tab-btn ${state.view==='review'?'active':'inactive'}" onclick="setView('review')">📊 Revisión</button>
    <button class="tab-btn ${state.view==='libros'?'active':'inactive'}" onclick="setView('libros')">📚 Libros</button>
  </div>

  <div class="content">
  `;

  if (state.view === 'week') {
    html += renderWeekView(ws);
  } else if (state.view === 'review') {
    html += renderReviewView(ws, ps);
  } else {
    html += renderLibrosView();
  }

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

function renderWeekView(ws) {
  let h = '';

  h += sectionTitle('📅', 'Hábitos Diarios', 'Lunes a Sábado · Marca cada noche');

  for (const habit of DAILY_HABITS) {
    h += `<div class="habit-card">
      <div class="habit-header">
        <span class="habit-emoji">${habit.emoji}</span>
        <div>
          <div class="habit-name">${habit.label}</div>
          <div class="habit-desc">${habit.desc}</div>
          <span class="pilar-badge pilar-${habit.pilar}">${habit.pilarLabel}</span>
        </div>
      </div>
      <div class="habit-days">`;
    for (let d = 0; d < 6; d++) {
      const key = `w${state.week}_d${d}_${habit.id}`;
      const done = !!state.data[key];
      h += `<button class="day-btn ${done?'done':'undone'}" onclick="toggle('${key}')">
        <span class="day-label">${DAYS[d]}</span>
        <span class="day-check">${done?'✅':'⬜'}</span>
      </button>`;
    }
    h += `</div></div>`;
  }

  h += sectionTitle('🎯', 'Hitos Semanales', 'Victorias tácticas de esta semana');
  for (const m of WEEKLY_MILESTONES) {
    const key = `w${state.week}_wm_${m.id}`;
    const done = !!state.data[key];
    h += milestoneCard(m, done, key);
  }

  h += sectionTitle('🏆', 'Metas del Ciclo 90 Días', 'Una sola vez — marcas cuando se logran');
  for (const m of PROJECT_MILESTONES) {
    const key = `pm_${m.id}`;
    const done = !!state.data[key];
    h += milestoneCard(m, done, key);
  }

  h += sectionTitle('🚫', 'Límites del Modo Monje', 'Lo que NO está permitido en este ciclo');
  h += `<div class="limits-card">`;
  for (const l of LIMITS) {
    h += `<div class="limit-row"><span class="limit-x">✕</span><span class="limit-text">${l}</span></div>`;
  }
  h += `</div>`;

  h += `<div class="footer-note" style="margin-top:20px">
    <span>Revisión Dominical: 7–8 PM</span><br>
    Evalúa la semana, no te juzgues — ajusta y sigue adelante.
  </div>`;

  return h;
}

function renderReviewView(ws, ps) {
  let h = '';
  const color = pctColor(ws.pct);

  // Score de la semana actual
  h += `<div class="review-hero">
    <div class="review-eyebrow">Semana ${state.week} — Revisión Dominical</div>
    <div class="review-pct" style="color:${color}">${ws.pct}%</div>
    <div class="review-sub">${ws.done} de ${ws.total} hábitos cumplidos</div>
    ${ws.pct < 80 ? `<div class="review-missing">Faltaron ${ws.total - ws.done} hábitos — ¿qué pasó?</div>` : ''}
  </div>`;

  // Progreso por hábito
  h += sectionTitle('📊', 'Progreso por Hábito', 'Acumulado 90 días');
  for (const habit of DAILY_HABITS) {
    const s = habitScore(habit.id);
    const c = pctColor(s.pct);
    h += `<div class="progress-item">
      <span class="progress-emoji">${habit.emoji}</span>
      <div class="progress-body">
        <div class="progress-name">${habit.label.split(' — ')[1] || habit.label}</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width:${s.pct}%;background:${c}"></div>
        </div>
      </div>
      <span class="progress-count" style="color:${c}">${s.pct}%</span>
    </div>`;
  }

  // Historial de semanas
  h += sectionTitle('📅', 'Historial de Semanas', '');
  h += `<div class="week-history">`;
  for (let w = 1; w <= WEEKS_TOTAL; w++) {
    const s = weekScore(w);
    const c = pctColor(s.pct);
    const isActive = w === state.week;
    h += `<div class="week-pill" style="border-color:${c};${isActive?'box-shadow:0 0 0 2px '+c+';':''}" onclick="changeToWeek(${w})">
      <div class="week-pill-label">S${w}</div>
      <div class="week-pill-val" style="color:${c}">${s.pct > 0 ? s.pct+'%' : '—'}</div>
    </div>`;
  }
  h += `</div>`;

  // Mejor y peor semana
  let best = {w:1,pct:0}, worst = {w:1,pct:100};
  for (let w = 1; w <= WEEKS_TOTAL; w++) {
    const p = weekScore(w).pct;
    if (p > best.pct) best = {w,pct:p};
    if (p < worst.pct) worst = {w,pct:p};
  }
  h += `<div class="bw-row">
    <div class="bw-card best">
      <div class="bw-eyebrow">Mejor semana</div>
      <div class="bw-week">S${best.w}</div>
      <div class="bw-pct">${best.pct}%</div>
    </div>
    <div class="bw-card worst">
      <div class="bw-eyebrow">Semana más baja</div>
      <div class="bw-week">S${worst.w}</div>
      <div class="bw-pct">${worst.pct}%</div>
    </div>
  </div>`;

  // Metas del ciclo
  h += sectionTitle('🏆', 'Metas del Ciclo', '');
  h += `<div class="project-list">`;
  for (const m of PROJECT_MILESTONES) {
    const done = !!state.data[`pm_${m.id}`];
    h += `<div class="project-row">
      <span class="project-label ${done?'done':'undone'}">${m.emoji} ${m.label}</span>
      <span>${done?'✅':'⬜'}</span>
    </div>`;
  }
  h += `</div>`;

  h += `<div class="footer-note">
    <span>Revisión dominical — 7 a 8 PM</span><br>
    Sé honesto contigo mismo. Los datos no mienten.<br>
    Ajusta, perdónate y vuelve al camino el lunes.
  </div>`;

  return h;
}

function renderLibrosView() {
  const leidos = LIBROS.filter(l => state.data[`libro_${l.id}`]).length;
  let h = '';

  h += `<div class="review-hero">
    <div class="review-eyebrow">Biblioteca Modo Monje</div>
    <div class="review-pct" style="color:#a5b4fc">${leidos}/${LIBROS.length}</div>
    <div class="review-sub">libros leídos de tu lista</div>
  </div>`;

  // Prioridad inmediata
  h += sectionTitle('🔥', 'Empieza aquí — Prioridad', 'Lee estos dos primero en este ciclo de 90 días');
  for (const libro of LIBROS.filter(l => l.prioridad)) {
    h += libroCard(libro);
  }

  // Por pilar
  const pilares = [
    { id: 'apertura', emoji: '🌅', label: 'Disciplina — Despertar temprano' },
    { id: 'negocio',  emoji: '🏪', label: 'Color Centro — Negocio' },
    { id: 'tiktok',   emoji: '📱', label: 'TikTok @garyburelo' },
    { id: 'mente',    emoji: '🧠', label: 'Mente' },
    { id: 'rodilla',  emoji: '🦵', label: 'Rehabilitación' },
    { id: 'ahorro',   emoji: '💰', label: 'Ahorro y dinero' },
  ];

  for (const pilar of pilares) {
    const libros = LIBROS.filter(l => l.pilar === pilar.id && !l.prioridad);
    if (!libros.length) continue;
    h += sectionTitle(pilar.emoji, pilar.label, '');
    for (const libro of libros) h += libroCard(libro);
  }

  const leidos2 = LIBROS.filter(l => state.data[`libro_${l.id}`]).length;
  h += `<div class="footer-note" style="margin-top:20px">
    <span>${leidos2} de ${LIBROS.length} leídos</span><br>
    Toca un libro para marcarlo como leído. Empieza siempre por los de prioridad.
  </div>`;

  return h;
}

function libroCard(libro) {
  const key = `libro_${libro.id}`;
  const leido = !!state.data[key];
  return `<div class="libro-card ${leido?'leido':''}" onclick="toggle('${key}')">
    <span class="libro-emoji">${libro.emoji}</span>
    <div class="libro-body">
      <div class="libro-titulo">${libro.titulo}</div>
      <div class="libro-autor">${libro.autor}</div>
      <div class="libro-pilar">
        <span class="pilar-badge pilar-${libro.pilar}">${libro.pilarLabel}</span>
        ${libro.prioridad ? '<span class="libro-prioridad">⭐ Prioridad</span>' : ''}
      </div>
      <div class="libro-por-que">${libro.porQue}</div>
    </div>
    <span class="libro-check">${leido?'✅':'⬜'}</span>
  </div>`;
}

// ── CONTROLS ──────────────────────────────────────────────────────────────────
function changeWeek(dir) {
  state.week = Math.max(1, Math.min(WEEKS_TOTAL, state.week + dir));
  render();
}
function changeToWeek(w) {
  state.week = w;
  state.view = 'week';
  render();
}
function setView(v) {
  state.view = v;
  render();
}

loadState();
render();
</script>
</body>
</html>
